# Mod metadata for Forge 1.20.1. The placeholders are filled by the processResources task of build.gradle.
modLoader="javafml"
loaderVersion="${loader_version}"
license="${license}"
#issueTrackerURL="https://github.com/SrNadien/PerfectMobFarmRevived/issues"

[[mods]]
modId="${modid}"
version="${mod_version}"
displayName="${mod_named}"
logoFile="mobfarm-banner.png"
authors="${author}, Sweetmimike"
credits="Original mod Perfect Mob Farm by Sweetmimike"
description='''${mod_description}'''

[[dependencies.${modid}]]
modId="forge"
mandatory=true
versionRange="[${forgeversion},)"
ordering="NONE"
side="BOTH"

[[dependencies.${modid}]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1]"
ordering="NONE"
side="BOTH"

# Optional integrations (see the compat package)
[[dependencies.${modid}]]
modId="jei"
mandatory=false
versionRange="[15,)"
ordering="NONE"
side="BOTH"

[[dependencies.${modid}]]
modId="jade"
mandatory=false
versionRange="[11,)"
ordering="NONE"
side="BOTH"
