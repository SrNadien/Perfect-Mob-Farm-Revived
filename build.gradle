plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = "${mcversion}-${mod_version}-${tag_lanzador}"
group = "${author}.${modid}"
base {
    archivesName = mod_named.replace(" ", "")
}

// Mojang ships Java 21 to end users in 1.20.5+, so your mod should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Genera tambien <nombre>-sources.jar junto al jar del mod
java {
    withSourcesJar()
}

//neoForge.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

neoForge {
    version = "${neoversion}"

    runs {
        client {
            client()
            // Open straight into the test world instead of the main menu
            programArguments.addAll '--quickPlaySingleplayer', 'New World'
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', "${modid}", '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

            // Makes FarmTier.isAvailable() true for the tiers that need other mods, so their blocks are registered and generated
            systemProperty 'perfectmobfarmrevived.datagen', 'true'
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            logLevel = org.slf4j.event.Level.DEBUG

            //Limit ram usage for the dev environment to 2GB
            jvmArgument '-Xmx2G'
        }
    }

    mods {
        "${modid}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    mavenCentral()
    maven {
        // JEI
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
            // Config library that JEI pulls in at runtime
            includeGroup 'net.mezzdev.config'
            // Patchouli (required by Ultimate Armoury)
            includeGroup 'vazkii.patchouli'
        }
    }
    exclusiveContent {
        // Jade (published on Modrinth only)
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    exclusiveContent {
        // Ultimate Armoury (the mod of the integration tiers), published on CurseForge
        forRepository {
            maven {
                name = 'Curse Maven'
                url = 'https://cursemaven.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
    maven {
        // Mekanism, only used in the dev environment to power the energy mob farms
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
        content {
            includeGroup 'mekanism'
        }
    }
    exclusiveContent {
        // GeckoLib (required by Ultimate Armoury)
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter {
            includeGroup 'software.bernie.geckolib'
        }
    }
}

dependencies {
    // Optional integrations: compiled against, never required at runtime.
    // Only the classes inside nadiendev.perfectmobfarm.compat may reference them.
    compileOnly "mezz.jei:jei-${mcversion}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${mcversion}-neoforge-api:${jei_version}"
    compileOnly "maven.modrinth:jade:${jade_version}"

    // Present in the dev environment so the integrations can be tested with runClient
    runtimeOnly "mezz.jei:jei-${mcversion}-neoforge:${jei_version}"
    runtimeOnly "maven.modrinth:jade:${jade_version}"

    // Ultimate Armoury (provides the material blocks of the mushashite, joanfoite and nadienite tiers) and its
    // required dependencies, so the three integration farms can be tested with runClient.
    // 9327829 is the CurseForge file id of UltimateArmoury-1.21.1-2.0.13-NeoForge.
    runtimeOnly "curse.maven:ultimate-armoury-tools-and-weapons-1736634:9327829"
    runtimeOnly "software.bernie.geckolib:geckolib-neoforge-${mcversion}:4.9.3"
    runtimeOnly "vazkii.patchouli:Patchouli:1.21.1-93-NEOFORGE"

    // Mekanism (creative energy cubes, cables, generators) to power the energy mob farms in runClient
    runtimeOnly "mekanism:Mekanism:${mekanism_version}"
    runtimeOnly "mekanism:Mekanism:${mekanism_version}:generators"
}

test {
    enabled = false
}

jar {
    manifest {
        attributes([
                "Specification-Title": archivesBaseName,
                "Specification-Vendor": "${author}",
                "Specification-Version": "1", // We are version 1 of ourselves
                "Implementation-Title": archivesBaseName,
                "Implementation-Version": "${version}",
                "Implementation-Vendor" :"${author}",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            mcversion              : mcversion,
            mod_version            : mod_version,
            modid                  : modid,
            author                 : author,
            mod_named              : mod_named,
            tag_lanzador           : tag_lanzador,
            mod_description        : mod_description,
            license                : license,
            neoversion             : neoversion,
            loader_version         : loader_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.getRelease().set(21)
}
