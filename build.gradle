plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "${mcversion}-${mod_version}-${tag_lanzador}"
group = "${author}.${modid}"
base {
    archivesName = mod_named.replace(" ", "")
}

// Minecraft 26.1 runs on Java 25
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Genera tambien <nombre>-sources.jar junto al jar del mod
java {
    withSourcesJar()
}

//neoForge.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

// Modid for data generation, where to output the resulting resources, and where to look for existing resources
def dataArguments = ['--mod', "${modid}", '--all', '--uncached', '--output', file('src/generated/resources/').getAbsolutePath(),
                     '--existing', file('src/main/resources/').getAbsolutePath()]

neoForge {
    version = "${neoversion}"

    runs {
        client {
            client()
            // Open straight into the test world instead of the main menu
            programArguments.addAll '--quickPlaySingleplayer', 'New World'
        }

        server {
            server()
            programArgument '--nogui'
        }

        // The data generation is split in two runs since 26.1: the client one writes the models, the blockstates, the item
        // definitions and the translations; the server one the recipes, the loot tables and the tags
        clientData {
            clientData()
            programArguments.addAll dataArguments
            // Makes FarmTier.isAvailable() true for the tiers that need other mods, so their blocks are registered and generated
            systemProperty 'perfectmobfarmrevived.datagen', 'true'
        }

        serverData {
            serverData()
            programArguments.addAll dataArguments
            systemProperty 'perfectmobfarmrevived.datagen', 'true'
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            logLevel = org.slf4j.event.Level.DEBUG

            //Limit ram usage for the dev environment to 2GB
            jvmArgument '-Xmx2G'
        }
    }

    mods {
        "${modid}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    exclude '.cache'
    srcDir 'src/generated/resources'
}

repositories {
    mavenCentral()
    maven {
        // JEI
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
            // Config library that JEI pulls in at runtime
            includeGroup 'net.mezzdev.config'
            // Patchouli (required by Ultimate Armoury)
            includeGroup 'vazkii.patchouli'
        }
    }
    exclusiveContent {
        // Jade (published on Modrinth only)
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    exclusiveContent {
        // Ultimate Armoury (the mod of the integration tiers), published on CurseForge
        forRepository {
            maven {
                name = 'Curse Maven'
                url = 'https://cursemaven.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
    exclusiveContent {
        // GeckoLib (required by Ultimate Armoury)
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter {
            includeGroup 'com.geckolib'
        }
    }
}

dependencies {
    // Optional integrations: compiled against, never required at runtime.
    // Only the classes inside nadiendev.perfectmobfarm.compat may reference them.
    compileOnly "mezz.jei:jei-${mcversion}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${mcversion}-neoforge-api:${jei_version}"
    compileOnly "maven.modrinth:jade:${jade_version}"

    // Present in the dev environment so the integrations can be tested with runClient
    runtimeOnly "mezz.jei:jei-${mcversion}-neoforge:${jei_version}"
    runtimeOnly "maven.modrinth:jade:${jade_version}"

    // Ultimate Armoury (provides the material blocks of the mushashite, joanfoite and nadienite tiers) and its
    // required dependencies, so the three integration farms can be tested with runClient.
    // 9327839 is the CurseForge file id of UltimateArmoury-26.1.2-2.0.13-NeoForge.
    runtimeOnly "curse.maven:ultimate-armoury-tools-and-weapons-1736634:${ultimate_armoury_file_id}"
    runtimeOnly "com.geckolib:geckolib-neoforge-${mcversion}:${geckolib_version}"
    runtimeOnly "vazkii.patchouli:patchouli-neoforge:${patchouli_version}"

    // Mekanism has no official 26.1.2 build. "Mekanism Version Locked" is an unofficial community port of it for
    // 26.1.2 (CurseForge project 1713956), used here to power the energy mob farms in runClient.
    runtimeOnly "curse.maven:mekanism-version-locked-1713956:${mekanism_version_locked_file_id}"
}

test {
    enabled = false
}

jar {
    manifest {
        attributes([
                "Specification-Title": base.archivesName.get(),
                "Specification-Vendor": "${author}",
                "Specification-Version": "1", // We are version 1 of ourselves
                "Implementation-Title": base.archivesName.get(),
                "Implementation-Version": "${version}",
                "Implementation-Vendor" :"${author}",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            mcversion              : mcversion,
            mod_version            : mod_version,
            modid                  : modid,
            author                 : author,
            mod_named              : mod_named,
            tag_lanzador           : tag_lanzador,
            mod_description        : mod_description,
            license                : license,
            neoversion             : neoversion,
            loader_version         : loader_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.getRelease().set(25)
}

// Both data runs in a row (the client one first), like the runData task of the older versions
tasks.register('runData') {
    group = 'mod development'
    description = 'Runs the client and the server data generation.'
    dependsOn 'runClientData'
    dependsOn 'runServerData'
}
tasks.matching { it.name == 'runServerData' }.configureEach { mustRunAfter 'runClientData' }
