plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}

version = "${mcversion}-${mod_version}-${tag_lanzador}"
group = "${author}.${modid}"
base {
    archivesName = mod_named.replace(" ", "")
}

// Minecraft 1.20.1 runs on Java 17
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Genera tambien <nombre>-sources.jar junto al jar del mod
java {
    withSourcesJar()
}

//legacyForge.accessTransformers.from rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

legacyForge {
    version = "${mcversion}-${forgeversion}"

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
            // Open straight into the test world instead of the main menu
            programArguments.addAll '--quickPlaySingleplayer', 'New World'
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', "${modid}", '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            logLevel = org.slf4j.event.Level.DEBUG

            //Limit ram usage for the dev environment to 2GB
            jvmArgument '-Xmx2G'
        }
    }

    mods {
        "${modid}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    mavenCentral()
    maven {
        // JEI
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
        }
    }
    exclusiveContent {
        // Jade (published on Modrinth only)
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        // Mekanism, only used in the dev environment to power the energy mob farms
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
        content {
            includeGroup 'mekanism'
        }
    }
}

dependencies {
    // Optional integrations: compiled against, never required at runtime.
    // Only the classes inside nadiendev.perfectmobfarm.compat may reference them.
    modCompileOnly "mezz.jei:jei-${mcversion}-common-api:${jei_version}"
    modCompileOnly "mezz.jei:jei-${mcversion}-forge-api:${jei_version}"
    modCompileOnly "maven.modrinth:jade:${jade_version}"

    // Present in the dev environment so the integrations can be tested with runClient
    modRuntimeOnly "mezz.jei:jei-${mcversion}-forge:${jei_version}"
    modRuntimeOnly "maven.modrinth:jade:${jade_version}"

    // Mekanism (creative energy cubes, cables, generators) to power the energy mob farms in runClient
    modRuntimeOnly "mekanism:Mekanism:${mekanism_version}"
    modRuntimeOnly "mekanism:Mekanism:${mekanism_version}:generators"
}

test {
    enabled = false
}

jar {
    manifest {
        attributes([
                "Specification-Title": archivesBaseName,
                "Specification-Vendor": "${author}",
                "Specification-Version": "1", // We are version 1 of ourselves
                "Implementation-Title": archivesBaseName,
                "Implementation-Version": "${version}",
                "Implementation-Vendor" :"${author}",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            mcversion              : mcversion,
            mod_version            : mod_version,
            modid                  : modid,
            author                 : author,
            mod_named              : mod_named,
            tag_lanzador           : tag_lanzador,
            mod_description        : mod_description,
            license                : license,
            forgeversion           : forgeversion,
            loader_version         : loader_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.getRelease().set(17)
}
